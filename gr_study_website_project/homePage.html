<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <title>自主學習專案測試</title>
        <style>
        .topbox{
            background-color: cornflowerblue;
            height: 200px;
            box-sizing: border-box;
        }
        .textbox_emu500{
            width: 100px;
            height: 100px;
            overflow: hidden; /* 圓角不會被圖遮住 */
            background-color: #333; /* 萬一圖沒跑出來深色底 */
            position: relative; /* 文字疊加 */
        }
        .blockimg{
            width: 200px;
            height: 200px;
            border-radius: 15px;
        }
    </style></head>
    <body>
        <div class="topbox">
            <h1 style="left: 300px; height: 100px; font-size: 60;">哈哈哈</h1>
        </div>
        <div class="testbox_emu500">
            <img src="photo/sealine_emu582.jpg" alt="EMU582" class="blockimg"><br>
            <a style="color: cornflowerblue;">早安，這是追分站的EMU582</a>
        </div>
    </body>
</html>
